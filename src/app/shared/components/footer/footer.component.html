<footer class="footer" *ngIf="company">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <div class="logo">
          <mat-icon>flight</mat-icon>
          <span>{{ company.name }}</span>
        </div>
        <p>{{ footerTagline }}</p>
      </div>

      <div class="footer-col">
        <h5>Quick Links</h5>
        <a routerLink="/">Home</a>
        <a routerLink="/treks">Treks</a>
        <a routerLink="/about">About Us</a>
        <a routerLink="/contact">Contact</a>
      </div>

      <div class="footer-col">
        <h5>Get in Touch</h5>
        <div class="contact-row"><mat-icon>location_on</mat-icon><span>{{ company.address }}</span></div>
        <div class="contact-row"><mat-icon>phone</mat-icon><span>{{ company.phone }}</span></div>
        <div class="contact-row"><mat-icon>email</mat-icon><a [href]="'mailto:' + company.email">{{ company.email }}</a></div>
      </div>
    </div>

    <div class="footer-bottom">
      <span>&copy; {{ currentYear }} {{ company.name }}. All rights reserved.</span>
      <span class="reg-info" *ngIf="company.registration">Reg: {{ company.registration }}</span>
    </div>
  </div>
</footer>
