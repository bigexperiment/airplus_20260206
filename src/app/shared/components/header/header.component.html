<header class="main-header" [class.scrolled]="isScrolled">
  <div class="container header-content">
    <a routerLink="/" class="logo">
      <mat-icon>flight</mat-icon>
      <span>AirPlus Nepal</span>
    </a>

    <nav class="main-nav">
      <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a mat-button routerLink="/treks" routerLinkActive="active">Treks</a>
      <a mat-button routerLink="/about" routerLinkActive="active">About</a>
      <a mat-button routerLink="/contact" routerLinkActive="active">Contact</a>

      <ng-container *ngIf="authService.isAuthenticated()">
        <button mat-button [matMenuTriggerFor]="adminMenu" class="admin-btn">
          <img *ngIf="currentUser?.avatarUrl" [src]="currentUser?.avatarUrl" class="user-avatar" alt="avatar">
          <mat-icon *ngIf="!currentUser?.avatarUrl">admin_panel_settings</mat-icon>
          {{ currentUser?.fullName || 'Admin' }}
        </button>
        <mat-menu #adminMenu="matMenu">
          <a mat-menu-item routerLink="/admin/dashboard">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>
          <a mat-menu-item routerLink="/admin/content">
            <mat-icon>edit</mat-icon>
            <span>Edit Site Content</span>
          </a>
          <a mat-menu-item routerLink="/admin/media">
            <mat-icon>photo_library</mat-icon>
            <span>Media Manager</span>
          </a>
          <mat-divider></mat-divider>
          <a mat-menu-item routerLink="/admin/treks">
            <mat-icon>hiking</mat-icon>
            <span>Treks</span>
          </a>
          <a mat-menu-item routerLink="/admin/bookings">
            <mat-icon>book_online</mat-icon>
            <span>Bookings</span>
          </a>
          <a mat-menu-item routerLink="/admin/categories">
            <mat-icon>category</mat-icon>
            <span>Categories</span>
          </a>
          <a mat-menu-item routerLink="/admin/users" *ngIf="authService.isAdmin()">
            <mat-icon>people</mat-icon>
            <span>Users</span>
          </a>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </ng-container>

      <a mat-button routerLink="/admin/login" *ngIf="!authService.isAuthenticated()" class="login-btn">
        <mat-icon>login</mat-icon>
        Login
      </a>
    </nav>

    <button mat-icon-button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <mat-icon>{{ mobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="mobileMenuOpen">
    <nav class="mobile-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">
        <mat-icon>home</mat-icon> Home
      </a>
      <a routerLink="/treks" routerLinkActive="active" (click)="closeMobileMenu()">
        <mat-icon>hiking</mat-icon> Treks
      </a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">
        <mat-icon>info</mat-icon> About
      </a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">
        <mat-icon>mail</mat-icon> Contact
      </a>

      <div class="mobile-divider"></div>

      <ng-container *ngIf="authService.isAuthenticated()">
        <a routerLink="/admin/dashboard" (click)="closeMobileMenu()">
          <mat-icon>dashboard</mat-icon> Dashboard
        </a>
        <a (click)="logout(); closeMobileMenu()" class="logout-link">
          <mat-icon>logout</mat-icon> Logout
        </a>
      </ng-container>

      <a routerLink="/admin/login" *ngIf="!authService.isAuthenticated()" (click)="closeMobileMenu()">
        <mat-icon>login</mat-icon> Admin Login
      </a>
    </nav>
  </div>
</header>
