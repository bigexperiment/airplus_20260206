<div class="login-page">
  <div class="login-container">
    <mat-card class="login-card">
      <mat-card-header>
        <div class="header-content">
          <mat-icon color="primary">admin_panel_settings</mat-icon>
          <mat-card-title>Admin Login</mat-card-title>
          <mat-card-subtitle>Trekking Nepal CRM</mat-card-subtitle>
        </div>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" required autocomplete="username">
            <mat-icon matSuffix>person</mat-icon>
            <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
              Username is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input 
              matInput 
              [type]="hidePassword ? 'password' : 'text'" 
              formControlName="password" 
              required
              autocomplete="current-password">
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="hidePassword = !hidePassword"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hidePassword">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>

          <button 
            mat-raised-button 
            color="primary" 
            type="submit" 
            class="full-width login-button"
            [disabled]="loginForm.invalid || loading">
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
            <span *ngIf="!loading">Login</span>
          </button>
        </form>

        <div class="demo-credentials">
          <mat-divider></mat-divider>
          <p class="demo-text">Demo Credentials:</p>
          <p><strong>Username:</strong> admin</p>
          <p><strong>Password:</strong> admin</p>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button routerLink="/" class="full-width">
          <mat-icon>arrow_back</mat-icon>
          Back to Website
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
